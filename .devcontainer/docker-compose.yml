services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    command: sleep infinity
    depends_on:
      - db
    # Runtime wiring only. Image-invariant env (locale, certs, fontconfig,
    # NODE_PATH, MIX_*_PATH, ELIXIR_ERL_OPTIONS) lives in the Dockerfile ENV.
    environment:
      # Agent behaviour — pin to the installed versions; no telemetry.
      # NOTE: no ANTHROPIC_* here on purpose. Setting ANTHROPIC_BASE_URL/TOKEN
      # would force Claude Code onto OpenCode Zen and suppress its OAuth login.
      # Claude Code + Codex authenticate via the user's own accounts; only
      # OpenCode + Pi use Zen (via OPENCODE_API_KEY / configure-agents.bash).
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      # App / service wiring
      MEMBA_NATIVE_DEVCONTAINER: "1"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vscode
      # Terminal
      TERM: xterm-256color
      COLORTERM: truecolor
    init: true
    volumes:
      - ..:/workspaces/memba:cached

  db:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_DB: memba_dev
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      POSTGRES_USER: vscode
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
